# 排水管网清淤记录系统 —— 一键启动编排
# 前端 http://localhost:8081    后端 http://localhost:8080/healthz
#
# 端口与数据库账号可通过根目录 .env 覆盖（参见 .env.example）。
services:
  postgres:
    image: postgres:16-alpine
    container_name: desilting-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-desilting}
      POSTGRES_USER: ${POSTGRES_USER:-desilting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-desilting123456}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-desilting} -d ${POSTGRES_DB:-desilting}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - desilting-net
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    image: desilting-backend:latest
    container_name: desilting-backend
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_PORT: 8080
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-info}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-desilting}
      DB_USER: ${POSTGRES_USER:-desilting}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-desilting123456}
      DB_SSLMODE: disable
      DB_TIMEZONE: Asia/Shanghai
      TZ: Asia/Shanghai
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '${BACKEND_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - desilting-net
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    image: desilting-frontend:latest
    container_name: desilting-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8081}:80'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - desilting-net
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  desilting-net:
    driver: bridge
