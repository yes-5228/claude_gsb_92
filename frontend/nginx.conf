server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 后端不可达时返回 JSON 结构，避免前端把网关 HTML 错误页当成业务数据解析
    error_page 502 503 504 = @backend_unavailable;

    # 前端调用 /api/** 时反向代理到后端容器
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 健康检查直接透传到后端，便于在容器编排里探测
    location = /healthz {
        proxy_pass       http://backend:8080/healthz;
        proxy_set_header Host $host;
    }

    # 网关错误统一返回业务可识别的 JSON，前端可直接展示 message
    location @backend_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"code":50000,"message":"后端服务暂不可用，请确认 backend 服务已就绪","data":null,"timestamp":0}';
    }

    # 单页应用路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
